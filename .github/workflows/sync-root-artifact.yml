name: Sync root ORDERS_AUTO artifact

on:
  push:
    branches:
      - fix/root-launch-artifact

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'build: sync root launcher'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/root-launch-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build root launcher
        run: npm run build

      - name: Commit generated launcher
        run: |
          git add ORDERS_AUTO.html
          if git diff --cached --quiet; then
            echo "Root launcher is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync root launcher"
          git push origin HEAD:fix/root-launch-artifact
