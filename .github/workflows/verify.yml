name: Verify ORDERS_AUTO

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --run 2>&1 | tee test-output.txt

      - name: Publish test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORDERS_AUTO-test-output
          path: test-output.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Build root ORDERS_AUTO.html
        run: npm run build

      - name: Verify committed root artifact is current
        run: git diff --exit-code -- ORDERS_AUTO.html

      - name: Chrome file protocol smoke
        run: npm run test:e2e

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Publish testable HTML
        uses: actions/upload-artifact@v4
        with:
          name: ORDERS_AUTO-preview
          path: ORDERS_AUTO.html
          if-no-files-found: error
          retention-days: 14
