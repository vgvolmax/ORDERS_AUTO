name: Verify ORDERS_AUTO

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Build offline production package
        run: npm run build

      - name: Validate offline production package
        run: npm run validate:package

      - name: Verify byte-reproducible production build
        run: |
          cp -a dist/ORDERS_AUTO "$RUNNER_TEMP/build1"
          npm run build
          diff -qr "$RUNNER_TEMP/build1" dist/ORDERS_AUTO

      - name: Chrome file protocol smoke
        run: npm run test:e2e

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Publish production package
        uses: actions/upload-artifact@v4
        with:
          name: ORDERS_AUTO-production
          path: dist/ORDERS_AUTO
          if-no-files-found: error
          retention-days: 14
