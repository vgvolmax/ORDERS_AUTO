name: Verify ORDERS_AUTO

on:
  pull_request:
  push:
    branches:
      - "codex/-mvp-orders_auto"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The original Codex commit did not contain a lockfile. Generate it once
      # and persist it to this feature branch so later clean clones can use npm ci.
      - name: Bootstrap package-lock.json when missing
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add deterministic npm lockfile"
            git push
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify
        run: npm run verify
