name: Verify ORDERS_AUTO

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Build and single-file check
        run: npm run build

      - name: Publish preview HTML
        uses: actions/upload-artifact@v4
        with:
          name: ORDERS_AUTO-preview
          path: dist/index.html
          if-no-files-found: error
          retention-days: 7
