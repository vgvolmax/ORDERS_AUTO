name: Verify ORDERS_AUTO

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Build root ORDERS_AUTO.html
        run: npm run build

      - name: Verify byte-reproducible production build
        run: |
          cp ORDERS_AUTO.html "$RUNNER_TEMP/ORDERS_AUTO.first.html"
          npm run build
          cmp "$RUNNER_TEMP/ORDERS_AUTO.first.html" ORDERS_AUTO.html
          sha256sum "$RUNNER_TEMP/ORDERS_AUTO.first.html" ORDERS_AUTO.html

      - name: Chrome file protocol smoke
        run: npm run test:e2e

      - name: Verify committed root artifact is current
        run: git diff --exit-code -- ORDERS_AUTO.html

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Publish testable HTML
        uses: actions/upload-artifact@v4
        with:
          name: ORDERS_AUTO-preview
          path: ORDERS_AUTO.html
          if-no-files-found: error
          retention-days: 14
