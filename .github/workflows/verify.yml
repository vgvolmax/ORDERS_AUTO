name: Verify ORDERS_AUTO

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Temporary migration step: once the generated lockfile is committed in
      # this PR this step and its artifact are removed and CI returns to npm ci.
      - name: Refresh dependency lock candidate
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Publish lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Build and single-file check
        run: npm run build

      - name: Chrome file protocol smoke
        run: npm run test:e2e

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Stage user-facing HTML
        run: |
          mkdir -p release
          cp dist/index.html release/ORDERS_AUTO.html

      - name: Publish testable HTML
        uses: actions/upload-artifact@v4
        with:
          name: ORDERS_AUTO-preview
          path: release/ORDERS_AUTO.html
          if-no-files-found: error
          retention-days: 14
